[package]
name = "bme688-exporter"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4", features = ["derive"] }
libc = "0.2"
prometheus-client = "0.25"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.4"
thiserror = "2"
tiny_http = "0.12"

[build-dependencies]
bindgen = "0.73"
cc = "1"
